name: Refresh hub

# Weekly rebuild so new @lacspace/* releases flow into this site even without a
# code push. (Pushing to main also auto-deploys via the Vercel git integration.)
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy (fresh install pulls latest @lacspace/*)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project lacspace-developer-platform --scope lacspacecorp --token "$VERCEL_TOKEN"
          npx --yes vercel@latest --prod --yes --scope lacspacecorp --token "$VERCEL_TOKEN"
